name: Build Uzay Bulteni APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-disabled: true
      - name: Build Debug APK
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip
          fi
          BUILD_DIR=$(find . -name "settings.gradle" -exec dirname {} \; | head -n 1)
          cd "$BUILD_DIR"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --no-daemon
      - name: Prepare APK
        run: |
          mkdir -p release-apk
          APK_PATH=$(find . -name "*debug.apk" | head -n 1)
          cp "$APK_PATH" release-apk/UzayBulteni.apk
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UzayBulteni-APK
          path: release-apk/UzayBulteni.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          files: release-apk/UzayBulteni.apk
          tag_name: v1.0.0
          name: "🚀 Uzay Bülteni Android APK (v1.0)"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
